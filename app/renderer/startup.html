<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; font-src 'self'" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <div class="startup-logo" aria-hidden="true">

        <span>本地翻译工作台</span>
        <strong id="startupPercent">12%</strong>
      </div>
      <div class="startup-progress-track" aria-hidden="true">
        <i class="startup-progress-fill"></i>
        <b></b>
      </div>
      <div class="startup-foot">
        <span><i></i>完全离线</span>
